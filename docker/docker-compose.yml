# 1 coordinator + 5 data nodes; each data node holds one base partition
# and one index partition.  NNODES=2..5 uses only shard1..shardN (the
# others idle); changing it needs `docker compose down -v`.
x-node: &node
  image: gsi-pg:16
  build: { context: .., dockerfile: docker/Dockerfile }
  environment:
    POSTGRES_HOST_AUTH_METHOD: trust
  cap_add: [NET_ADMIN]          # bench/net_delay.sh adds network delay with tc
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "postgres"]
    interval: 2s
    retries: 30

x-shard: &shard
  <<: *node
  # syncfs: crash recovery syncs the data directory with one call, not an
  # fsync per file (minutes on Docker Desktop's disk); crash tests and the
  # demo restart nodes often
  command: postgres -c max_prepared_transactions=100 -c recovery_init_sync_method=syncfs
  volumes: ["./init/datanode.sql:/docker-entrypoint-initdb.d/init.sql:ro"]

services:
  shard1:
    <<: *shard
    ports: ["5433:5432"]
  shard2:
    <<: *shard
    ports: ["5434:5432"]
    depends_on: [shard1]
  shard3:
    <<: *shard
    ports: ["5435:5432"]
    depends_on: [shard1]
  shard4:
    <<: *shard
    ports: ["5436:5432"]
    depends_on: [shard1]
  shard5:
    <<: *shard
    ports: ["5437:5432"]
    depends_on: [shard1]
  coordinator:
    <<: *node
    command: >
      postgres -c shared_preload_libraries=gsi_fdw
               -c max_prepared_transactions=100
               -c synchronous_commit=on
               -c recovery_init_sync_method=syncfs
               -c gsi.applier_workers=${NNODES:-5}
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      NNODES: ${NNODES:-5}
    ports: ["5432:5432"]
    volumes: ["./init/coordinator.sh:/docker-entrypoint-initdb.d/init.sh:ro"]
    depends_on:
      shard1: { condition: service_healthy }
      shard2: { condition: service_healthy }
      shard3: { condition: service_healthy }
      shard4: { condition: service_healthy }
      shard5: { condition: service_healthy }
